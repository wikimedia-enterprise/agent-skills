variables:
  # CI capacity is a nodepool tainted `ci-latest=true:NoSchedule`; without this
  # toleration a job sits Pending.
  KUBERNETES_NODE_TOLERATIONS: 'ci-latest=true:NoSchedule'

default:
  # The runner tag every Growth project uses.
  tags:
    - wme-eks-generic-dv
  interruptible: true

check:
  image: node:24-alpine
  script:
    - npm run check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
