default:
  # The runner tag every Growth project uses.
  tags:
    - gtm
  interruptible: true

check:
  image: node:24-alpine
  script:
    - npm run check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
